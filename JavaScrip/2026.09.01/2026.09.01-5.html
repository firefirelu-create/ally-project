<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function celsiusToFahrenheit(location = "台中",celsius=25){
            return `${location}的攝氏溫度 ${celsius}c 轉換為華氏溫度為:${(celsius *1.8+32)}f`;
        }
            
        

        console.log(celsiusToFahrenheit("台北",35));//77

    </script>
    
</body>
</html>
