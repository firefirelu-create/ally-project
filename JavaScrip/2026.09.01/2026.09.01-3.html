<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數學運算</title>
</head>
<body>
    <script>
        let a=10;
        let b=20;
        let c="30";

        console.log(a +b);
        console.log(b +c);
        console.log(a+b+c)
        console.log(c+a+b)

        //Number()
        console.log(a +b + Number(c));
        console.log(a+b+c)

        const pi=3.1415926;
        console.log(pi);
        console.log(pi.toFixed(3))

        console.log(`${a} >${b} = ${a>b}`);
        console.log(`${a} <=${b} = ${a<=b}`);

        let d = null;
        let e;

        console.log(d);
        console.log(e);

        console.log(d +10);
        console.log(e +10);//NaN=> Not a Number

    </script>
</body>
</html>
