<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>函數設定</title>
</head>
<body>
    <script>
        function celsiusToFahrenheit(celsius =25) {
            return celsius *1.8 +32;
        }

        console.log(celsiusToFahrenheit(25));//77
        console.log(celsiusToFahrenheit(30));//86
        console.log(celsiusToFahrenheit(35));//95
        console.log(celsiusToFahrenheit(40));//104
        console.log(celsiusToFahrenheit());//86



    </script>
</body>
</html>
